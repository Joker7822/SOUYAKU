services:
  - type: web
    name: souyaku-token-relay
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: SOUYAKU_AI_MODEL
        value: gpt-5.6-luna
      - key: SOUYAKU_AI_RATE_MAX
        value: "30"
